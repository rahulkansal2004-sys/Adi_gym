name: Build APK from zip
on:
  workflow_dispatch:
  push:
    paths: ['fitcoach-src.zip']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q fitcoach-src.zip && ls fitcoach
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: cd fitcoach && npm ci && npm test && npm run build && npx cap sync android
      - run: cd fitcoach/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fitcoach-debug-apk
          path: fitcoach/android/app/build/outputs/apk/debug/app-debug.apk
